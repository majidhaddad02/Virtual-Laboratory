<footer class="site-foot">

  <div class="bar">بکشید · اسلایدر · مشاهده کنید</div>
</footer>
<script>
var titles={all:'همه شبیه‌سازی‌ها',molecular:'نیروی مولکولی',pressure:'فشار'};
document.querySelectorAll('#filters .chip').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#filters .chip').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    var f=b.getAttribute('data-f');
    document.getElementById('ptitle').textContent=titles[f];
    document.querySelectorAll('.sim-card').forEach(function(c){
      c.style.display=(f==='all'||c.getAttribute('data-cat')===f)?'flex':'none';
    });
  };
});
</script>
</body>
</html>
